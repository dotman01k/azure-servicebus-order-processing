name: Preview or deploy sandbox
'on':
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options:
        - preview
        - apply
        default: preview
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: orders-sandbox
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: azure-dev
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      PREFIX: ${{ vars.PREFIX || 'orderlab' }}
      OPERATOR_OBJECT_ID: ${{ vars.OPERATOR_OBJECT_ID }}
      OPERATOR_PRINCIPAL_TYPE: ${{ vars.OPERATOR_PRINCIPAL_TYPE || 'User' }}
      CONFIRM_DEPLOY: ${{ inputs.operation == 'apply' && vars.RESOURCE_GROUP || '' }}
      OPERATION: ${{ inputs.operation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install --require-hashes -r requirements.lock
    - run: az bicep install
    - run: bash scripts/validate.sh
    - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Preview or explicitly deploy
      run: bash scripts/deploy.sh "$OPERATION"
