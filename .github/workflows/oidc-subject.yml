name: Inspect deployment federation subject
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  claims:
    if: github.ref == 'refs/heads/main'
    environment: azure-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Show issuer, audience and subject only
        run: python scripts/show-oidc-subject.py
